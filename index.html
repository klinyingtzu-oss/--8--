<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的旅遊手冊</title>
    <style>
        :root { --main-color: #4a90e2; --bg-color: #f4f4f9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-color); margin: 0; padding-bottom: 50px; }
        
        /* 換色控制項 */
        .theme-picker { padding: 10px; background: #fff; display: flex; gap: 10px; justify-content: center; }
        .dot { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #ddd; cursor: pointer; }

        /* 天數導覽 */
        .nav { position: sticky; top: 0; background: white; display: flex; overflow-x: auto; border-bottom: 1px solid #ddd; z-index: 100; }
        .nav-item { padding: 15px 20px; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--main-color); border-bottom: 3px solid var(--main-color); font-weight: bold; }

        /* 行程卡片 (直列) */
        .timeline { padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 5px solid var(--main-color); }
        .time { color: var(--main-color); font-weight: bold; font-size: 0.9em; margin-bottom: 5px; }
        .loc { font-size: 1.2em; font-weight: bold; margin-bottom: 8px; }
        .note { font-size: 0.9em; color: #555; white-space: pre-wrap; line-height: 1.5; background: #f9f9f9; padding: 8px; border-radius: 5px; }
        .btns { margin-top: 10px; display: flex; gap: 10px; }
        .btn { padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 0.8em; color: white; background: var(--main-color); }
        
        /* 離線提示 */
        .offline-tip { background: #fff3cd; text-align: center; padding: 5px; font-size: 0.8em; display: none; }
    </style>
</head>
<body>

    <div class="offline-tip" id="offlineMsg">⚠️ 目前為離線模式，顯示最後一次更新的內容</div>

    <div class="theme-picker">
        <div class="dot" style="background:#4a90e2" onclick="changeColor('#4a90e2')"></div>
        <div class="dot" style="background:#e67e22" onclick="changeColor('#e67e22')"></div>
        <div class="dot" style="background:#27ae60" onclick="changeColor('#27ae60')"></div>
        <div class="dot" style="background:#e91e63" onclick="changeColor('#e91e63')"></div>
    </div>

    <div class="nav" id="dayNav"></div>
    <div class="timeline" id="content">讀取行程中...</div>

    <script>
        // 【重要】請把下方網址替換成你從 Google 試算表複製的 CSV 網址
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQvJrfnAiYw3-NvbrcoKJeZZiwv981LT-dibEqvirgdfJZbXSEk5bS-KVsUaW2AuDS3K6F0uKK3Vg-E/pub?output=csv'; 
        let allData = [];

        async function fetchData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                parseCSV(data);
                localStorage.setItem('travel_cache', data); // 儲存供離線使用
            } catch (e) {
                const cache = localStorage.getItem('travel_cache');
                if(cache) {
                    parseCSV(cache);
                    document.getElementById('offlineMsg').style.display = 'block';
                }
            }
        }

        function parseCSV(csvText) {
            const rows = csvText.split('\n').slice(1);
            allData = rows.map(row => {
                const cols = row.split(',');
                return { day: cols[0], time: cols[1], loc: cols[2], note: cols[3], url: cols[4], map: cols[5] };
            });
            renderNav();
            renderDay(allData[0].day);
        }

        function renderNav() {
            const days = [...new Set(allData.map(d => d.day))];
            const nav = document.getElementById('dayNav');
            nav.innerHTML = days.map((d, i) => `<div class="nav-item ${i===0?'active':''}" onclick="renderDay('${d}', this)">Day ${d}</div>`).join('');
        }

        function renderDay(day, el) {
            if(el) {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                el.classList.add('active');
            }
            const filtered = allData.filter(d => d.day === day);
            document.getElementById('content').innerHTML = filtered.map(item => `
                <div class="card">
                    <div class="time">${item.time}</div>
                    <div class="loc">${item.loc}</div>
                    ${item.note ? `<div class="note">${item.note}</div>` : ''}
                    <div class="btns">
                        ${item.url ? `<a class="btn" href="${item.url}" target="_blank">官網/預約</a>` : ''}
                        ${item.map ? `<a class="btn" href="${item.map}" target="_blank">🗺️ 查看地圖</a>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function changeColor(color) {
            document.documentElement.style.setProperty('--main-color', color);
        }

        fetchData();
    </script>
</body>
</html>
