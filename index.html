<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>日本8日遊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main-blue: #2563eb; --bg-gray: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .timeline-border { border-left: 2px dashed #cbd5e1; }
        body { -webkit-tap-highlight-color: transparent; background-color: var(--bg-gray); scroll-behavior: smooth; }
        .day-card { scroll-margin-top: 80px; }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 bg-white shadow-sm border-b">
        <div class="p-3 pb-1 text-center font-bold text-blue-600 text-lg">🇯🇵 日本8日遊</div>
        <div class="flex overflow-x-auto p-3 gap-2 no-scrollbar" id="day-nav">
            </div>
    </header>

    <main class="max-w-md mx-auto p-4 min-h-screen" id="itinerary-content">
        <div class="flex flex-col items-center justify-center py-20 text-gray-400">
            <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
            <p id="loading-text">正在從試算表同步行程...</p>
        </div>
    </main>

    <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="fixed bottom-6 right-6 w-12 h-12 bg-blue-600 text-white rounded-full shadow-lg flex items-center justify-center transition active:scale-90">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script>
        // ==========================================
        // 1. 設定區：請在此放入你的 CSV 連結
        // ==========================================
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQvJrfnAiYw3-NvbrcoKJeZZiwv981LT-dibEqvirgdfJZbXSEk5bS-KVsUaW2AuDS3K6F0uKK3Vg-E/pub?output=csv'; 

        // 2. 初始化天數導覽按鈕
        const nav = document.getElementById('day-nav');
        for (let i = 1; i <= 8; i++) {
            nav.innerHTML += `
                <a href="#day${i}" class="flex-none px-5 py-2 rounded-full bg-slate-100 text-slate-600 font-bold text-sm active:bg-blue-600 active:text-white transition">
                    Day ${i}
                </a>`;
        }

        // 3. 核心功能：抓取資料
        async function loadData() {
            const container = document.getElementById('itinerary-content');
            try {
                // 檢查連結是否有效
                if (!SHEET_CSV_URL.startsWith('http')) {
                    throw new Error("尚未設定正確的 CSV 連結。");
                }

                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error("讀取失敗，請確認試算表是否已『發佈到網路』。");

                const csvData = await response.text();
                const rows = parseCSV(csvData);
                
                if (rows.length === 0) throw new Error("試算表中沒有找到行程資料。");

                renderItinerary(rows);
                localStorage.setItem('japanTripData', JSON.stringify(rows));

            } catch (error) {
                console.error(error);
                // 嘗試讀取快取
                const cachedData = localStorage.getItem('japanTripData');
                if (cachedData) {
                    renderItinerary(JSON.parse(cachedData));
                } else {
                    container.innerHTML = `
                        <div class="bg-red-50 border-l-4 border-red-500 p-4 mt-10">
                            <p class="text-red-700 font-bold">❌ 同步失敗</p>
                            <p class="text-red-600 text-sm mt-1">${error.message}</p>
                            <p class="text-xs text-gray-400 mt-4 underline" onclick="location.reload()">點此重試</p>
                        </div>`;
                }
            }
        }

        // 4. 解析 CSV 資料
        function parseCSV(csv) {
            const lines = csv.split('\n').filter(line => line.trim() !== '');
            return lines.slice(1).map(line => {
                const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                return {
                    day: values[0]?.replace(/"/g, '').trim(),
                    time: values[1]?.replace(/"/g, '').trim(),
                    title: values[2]?.replace(/"/g, '').trim(),
                    location: values[3]?.replace(/"/g, '').trim(),
                    note: values[4]?.replace(/"/g, '').trim(),
                    url: values[5]?.replace(/"/g, '').trim(),
                    mapUrl: values[6]?.replace(/"/g, '').trim()
                };
            });
        }

        // 5. 繪製行程 HTML
        function renderItinerary(data) {
            const container = document.getElementById('itinerary-content');
            container.innerHTML = '';

            for (let d = 1; d <= 8; d++) {
                const dayData = data.filter(item => item.day == d);
                if (dayData.length === 0) continue;

                let daySection = `
                <section id="day${d}" class="mb-10 day-card">
                    <h2 class="text-2xl font-black text-slate-800 mb-5 flex items-center">
                        <span class="bg-blue-600 text-white px-3 py-1 rounded-lg mr-2 text-base shadow-sm">D${d}</span>
                        Day ${d}
                    </h2>
                    <div class="ml-3 timeline-border pl-6 space-y-6">`;

                dayData.forEach(item => {
                    // 自動生成 Google Map 連結，如果原本沒填的話
                    const mapLink = item.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location || item.title)}`;
                    
                    daySection += `
                    <div class="relative">
                        <div class="absolute -left-[33px] top-1.5 w-4 h-4 rounded-full bg-blue-600 border-4 border-white shadow-sm"></div>
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 active:bg-slate-50 transition">
                            <div class="flex justify-between items-center mb-1 text-blue-600 font-bold text-sm italic">
                                <span><i class="far fa-clock mr-1"></i> ${item.time}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800">${item.title}</h3>
                            <p class="text-sm text-slate-500 mt-1"><i class="fas fa-location-dot mr-1 text-red-400"></i> ${item.location}</p>
                            
                            ${item.note ? `
                            <div class="mt-3 text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border-l-4 border-slate-200 leading-relaxed">
                                <strong>備註：</strong>${item.note}
                            </div>` : ''}
                            
                            <div class="mt-4 flex gap-2">
                                <a href="${mapLink}" target="_blank" class="flex-1 bg-blue-600 text-white text-center py-3 rounded-xl text-xs font-bold active:bg-blue-700 transition shadow-sm">
                                    <i class="fas fa-map-marked-alt mr-1"></i> 開啟地圖
                                </a>
                                ${item.url ? `
                                <a href="${item.url}" target="_blank" class="flex-1 bg-white border border-slate-200 text-slate-700 text-center py-3 rounded-xl text-xs font-bold active:bg-slate-100">
                                    <i class="fas fa-link mr-1"></i> 詳細資料
                                </a>` : ''}
                            </div>
                        </div>
                    </div>`;
                });

                daySection += `</div></section>`;
                container.innerHTML += daySection;
            }
        }

        // 執行載入
        loadData();
    </script>
</body>
</html>
