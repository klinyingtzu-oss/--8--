<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊手冊 Pro</title>
    <style>
        :root {
            --primary-blue: #1a4d8f;
            --light-blue: #e8f0fe;
            --white: #ffffff;
            --arrow-gray: #bdc3c7;
            --link-green: #27ae60;
        }

        body { 
            font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; 
            margin: 0; background: #f4f7f9; color: #333; 
        }

        .header-fixed {
            position: sticky; top: 0; z-index: 1000;
            background: var(--primary-blue); color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .trip-main-info { padding: 15px 20px 5px 20px; text-align: center; }
        .trip-main-info h1 { margin: 0; font-size: 1.3rem; }
        
        .top-info-bar {
            background: rgba(255, 255, 255, 0.1);
            margin: 10px 15px 15px 15px; padding: 12px; border-radius: 8px; font-size: 0.9rem;
        }
        .info-row { display: flex; margin-bottom: 5px; }
        .info-label { width: 85px; flex-shrink: 0; opacity: 0.8; }

        .day-nav { display: flex; overflow-x: auto; background: var(--white); border-bottom: 1px solid #ddd; }
        .day-tab {
            flex: 1; min-width: 80px; padding: 15px 0; text-align: center;
            color: #666; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent;
        }
        .day-tab.active { color: var(--primary-blue); border-bottom: 3px solid var(--primary-blue); background: #f9fbff; }

        .timeline { padding: 20px 15px; max-width: 500px; margin: 0 auto; }
        
        .event-card {
            display: flex; background: var(--white); border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08); border: 1px solid #eee; overflow: hidden;
        }

        .time-label {
            width: 95px;
            background: var(--light-blue); color: var(--primary-blue);
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 1.15rem;
            flex-shrink: 0; border-right: 1px solid #dce6f2;
        }

        .content-body { padding: 15px; flex-grow: 1; }

        .loc-tag {
            display: inline-block; color: white;
            padding: 5px 15px; border-radius: 6px;
            font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;
        }

        .note-container { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
        .note-item { 
            font-size: 0.95rem; color: #444; background: #f8f9fa; 
            padding: 8px 12px; border-radius: 6px; border-left: 4px solid #ccd1d9;
        }

        /* 按鈕區 */
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .btn {
            text-decoration: none; font-size: 0.85rem; font-weight: bold;
            padding: 6px 14px; border-radius: 20px; display: inline-flex; align-items: center;
        }
        .map-btn { color: var(--primary-blue); border: 1px solid var(--primary-blue); }
        .link-btn { color: var(--link-green); border: 1px solid var(--link-green); }

        .transport-section {
            margin: 0 0 0 47px;
            padding: 10px 0 10px 40px;
            border-left: 3px solid var(--arrow-gray);
            position: relative;
        }
        .transport-section::after {
            content: "▼";
            position: absolute; bottom: -8px; left: -8px;
            color: var(--arrow-gray); font-size: 12px;
        }
        .trans-step {
            font-size: 0.9rem; color: #555; margin-bottom: 8px;
            background: #eee; padding: 6px 14px; border-radius: 12px;
            display: block; width: fit-content;
        }
        .trans-step b { color: #000; margin-left: 5px; }

        #offline-status { background: #fff3cd; color: #856404; text-align: center; font-size: 0.75rem; padding: 4px; display: none; }
    </style>
</head>
<body>

<div class="header-fixed">
    <div id="offline-status">離線模式：顯示快取資料</div>
    <div class="trip-main-info"><h1>日本8日遊行程</h1></div>
    <div class="top-info-bar">
        <div class="info-row"><span class="info-label">日期：</span><span id="display-date">-</span></div>
        <div class="info-row"><span class="info-label">住宿地點：</span><span id="display-stay">-</span></div>
    </div>
    <div class="day-nav" id="dayNav"></div>
</div>

<div class="timeline" id="itineraryContent"></div>

<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQvJrfnAiYw3-NvbrcoKJeZZiwv981LT-dibEqvirgdfJZbXSEk5bS-KVsUaW2AuDS3K6F0uKK3Vg-E/pub?output=csv'; 
    let travelData = [];

    async function fetchData() {
        try {
            const response = await fetch(SHEET_CSV_URL);
            const csvText = await response.text();
            localStorage.setItem('trip_v6_cache', csvText);
            render(csvText);
        } catch (e) {
            const cache = localStorage.getItem('trip_v6_cache');
            if (cache) { render(cache); document.getElementById('offline-status').style.display = 'block'; }
        }
    }

    function render(csvData) {
        const rows = csvData.split(/\r?\n/).filter(r => r.trim() !== "");
        travelData = rows.slice(1).map(row => {
            const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
            return {
                day: c[0]?.replace(/"/g, '').trim(),
                date: c[1]?.replace(/"/g, '').trim(),
                stay: c[2]?.replace(/"/g, '').trim(),
                time: c[3]?.replace(/"/g, '').trim(),
                loc: c[4]?.replace(/"/g, '').trim(),
                note: c[5]?.replace(/"/g, '').trim(),
                map: c[6]?.replace(/"/g, '').trim(),
                trans: c[7]?.replace(/"/g, '').trim(),
                duration: c[8]?.replace(/"/g, '').trim(),
                userColor: c[9]?.replace(/"/g, '').trim(),
                links: c[10]?.replace(/"/g, '').trim() // 讀取 K 欄連結
            };
        });

        if (travelData.length > 0) {
            document.getElementById('display-date').innerText = `${travelData[0].date}  ${travelData[travelData.length - 1].date}`;
        }

        const uniqueDays = [...new Set(travelData.map(t => t.day))];
        const nav = document.getElementById('dayNav');
        nav.innerHTML = uniqueDays.map((d, i) => `<div class="day-tab ${i===0?'active':''}" onclick="changeDay('${d}', this)">Day ${d}</div>`).join('');
        changeDay(uniqueDays[0]);
    }

    function changeDay(day, el) {
        if (el) {
            document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }
        const filtered = travelData.filter(t => t.day === day);
        if(filtered.length > 0) document.getElementById('display-stay').innerText = filtered[0].stay;

        let html = '';
        filtered.forEach((item) => {
            const notes = (item.note || "").split(/;|；/).map(n => n.trim()).filter(n => n !== "");
            const notesHtml = notes.map(n => `<div class="note-item">${n}</div>`).join('');

            const transSteps = (item.trans || "").split(/;|；/).map(t => t.trim()).filter(t => t !== "");
            const durSteps = (item.duration || "").split(/;|；/).map(d => d.trim());
            
            let transHtml = "";
            if(transSteps.length > 0) {
                transHtml = `<div class="transport-section">`;
                transSteps.forEach((step, i) => {
                    const dur = durSteps[i] ? `<b>(${durSteps[i]})</b>` : "";
                    transHtml += `<div class="trans-step">${step} ${dur}</div>`;
                });
                transHtml += `</div>`;
            }

            // 處理額外連結
            const extraLinks = (item.links || "").split(/;|；/).map(l => l.trim()).filter(l => l !== "");
            const linksHtml = extraLinks.map((url, i) => `<a href="${url}" target="_blank" class="btn link-btn">🔗 連結 ${extraLinks.length > 1 ? i+1 : ''}</a>`).join('');

            const customBg = item.userColor || '#1a4d8f';

            html += `
                <div class="event-card">
                    <div class="time-label">${item.time}</div>
                    <div class="content-body">
                        <div class="loc-tag" style="background:${customBg}">${item.loc}</div>
                        ${notesHtml ? `<div class="note-container">${notesHtml}</div>` : ''}
                        <div class="btn-group">
                            ${item.map ? `<a href="${item.map}" target="_blank" class="btn map-btn">📍 查看地圖</a>` : ''}
                            ${linksHtml}
                        </div>
                    </div>
                </div>
                ${transHtml}
            `;
        });

        document.getElementById('itineraryContent').innerHTML = html;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    fetchData();
</script>

</body>
</html>
